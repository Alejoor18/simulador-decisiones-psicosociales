<mat-sidenav-container class="est-layout">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="sidebarMode()"
    [opened]="sidebarOpen()"
    (openedChange)="sidebarOpen.set($event)"
    fixedInViewport>
    <div class="sidebar__brand">
      <a routerLink="/estudiante/panel" class="sidebar__logo">
        <span class="sidebar__psi" aria-hidden="true">Ψ</span>
        <span class="sidebar__logo-text">Simulador de Decisiones</span>
      </a>
      <button type="button" class="sidebar__close" aria-label="Cerrar menú" (click)="closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar__nav">
      <div class="nav-group">
        <div class="nav-group__title">Mi espacio</div>
        <a
          class="nav-item"
          routerLink="/estudiante/panel"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeIfOver()">
          <app-nav-icon name="home" />
          <span>Inicio</span>
        </a>
        <a class="nav-item" routerLink="/estudiante/practicas" routerLinkActive="active" (click)="closeIfOver()">
          <app-nav-icon name="calendar" />
          <span>Mis prácticas</span>
        </a>
        <a class="nav-item" routerLink="/estudiante/resultados" routerLinkActive="active" (click)="closeIfOver()">
          <app-nav-icon name="results" />
          <span>Resultados</span>
        </a>
      </div>
    </nav>

    <footer class="sidebar__footer">
      <button type="button" class="nav-item nav-item--logout" (click)="cerrarSesion()">
        <app-nav-icon name="logout" />
        <span>Cerrar sesión</span>
      </button>
    </footer>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <header class="topbar">
      <div class="topbar__lead">
        @if (!sidebarOpen() || isHandset()) {
          <button type="button" class="topbar__menu topbar__menu--visible" aria-label="Menú" (click)="openSidebar()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        }
      </div>

      <div class="topbar__search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" placeholder="Buscar práctica…" [value]="busqueda()" (input)="onBusqueda($event)" />
      </div>

      <div class="topbar__actions">
        <span class="topbar__actions-divider" aria-hidden="true"></span>
        <div class="profile">
          <span class="profile__avatar">{{ iniciales() }}</span>
          <span class="profile__info">
            <span class="profile__name">{{ estudianteSession.nombreEstudiante() }}</span>
            <span class="profile__role">Estudiante</span>
          </span>
        </div>
      </div>
    </header>

    <main class="main-content estudiante-module">
      <ng-content />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
